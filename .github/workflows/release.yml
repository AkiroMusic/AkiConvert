name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build-win:
    needs: [quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 1
          if-no-files-found: error

  build-mac:
    needs: [quality-gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # macOS Universal 需要同时打包 x64 + arm64 的 FFmpeg；
      # postinstall 只下载当前 runner 架构（x64），必须显式补全双架构
      - run: npm run download:ffmpeg:all
      - run: npx electron-vite build
      - run: npx electron-builder --mac --universal --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无签名证书：关闭身份自动发现，避免 electron-builder 探测失败
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/
          retention-days: 1
          if-no-files-found: error

  build-linux:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx electron-vite build
      - run: npx electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build-win, build-mac, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
            *.AppImage
            *.blockmap
            *.yml
          generate_release_notes: true
